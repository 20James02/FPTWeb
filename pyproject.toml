[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pagefpt-backend"
version = "0.1.0"
description = "Lead-first Python backend for PageFPT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "cryptography>=44", "PyJWT[crypto]>=2.10,<3",
  "phonenumbers>=9,<10", "boto3>=1.37,<2", "Pillow>=11,<13",
  "maxminddb>=2.6,<4", "jinja2>=3.1,<4", "bleach>=6.2,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6", "respx>=0.22", "ruff>=0.11", "mypy>=1.15", "psycopg[binary]>=3.2,<4", "pgserver>=0.1", "locust>=2.35", "types-bleach", "types-Pillow"]

[tool.hatch.build.targets.wheel]
packages = ["src/pagefpt"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
[tool.vercel]
entrypoint = "app:app"

[tool.vercel.fastapi.static]
cdn = true
