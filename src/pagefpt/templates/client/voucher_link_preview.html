<!DOCTYPE html>
<html lang="vi" prefix="og: https://ogp.me/ns#">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title if title else '&#8203;' }}</title>
<meta name="description" content="{{ description if description else '&#8203;' }}">
<meta name="robots" content="noindex,follow">
<meta property="og:type" content="website">
<meta property="og:locale" content="vi_VN">
{% if custom_domain %}<meta property="og:site_name" content="{{ custom_domain }}">{% endif %}
<meta property="og:title" content="{{ title if title else '&#8203;' }}">
<meta property="og:description" content="{{ description if description else '&#8203;' }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:image" content="{{ image }}">
<meta property="og:image:alt" content="{{ title if title else '' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title if title else '&#8203;' }}">
<meta name="twitter:description" content="{{ description if description else '&#8203;' }}">
<meta name="twitter:image" content="{{ image }}">
<meta name="theme-color" content="#F26F21">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
</head>
<body><main>{% if title %}<h1>{{ title }}</h1>{% endif %}{% if description %}<p>{{ description }}</p>{% endif %}<img src="{{ image }}" alt="{{ title }}" style="max-width: 100%; height: auto;"><p><a href="{{ target }}">Xem gói cước và nhận tư vấn</a></p></main></body>
</html>
