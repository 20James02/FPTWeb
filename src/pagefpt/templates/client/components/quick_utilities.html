<!-- Quick Utilities & Shortcuts Bar (fpt.vn style) -->
<section class="quick-utilities-section" aria-label="Tiện ích nhanh FPT">
  <div class="container">
    <div class="quick-utilities-card" data-aos="fade-up" data-aos-duration="600">
      <div class="quick-utilities-grid">
        
        <!-- Utility 1: Đăng ký lắp đặt online -->
        <button type="button" class="utility-item quick-utility-item" onclick="openBottomSheet('Đăng ký Online', '', null, 'internet')" data-aos="fade-up" data-aos-delay="50">
          <div class="utility-icon-box" style="background: rgba(242, 111, 33, 0.1); color: var(--color-primary);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
          </div>
          <div class="utility-text">
            <span class="utility-title">Đăng ký</span>
            <span class="utility-subtitle">Để lại thông tin</span>
          </div>
        </button>

        <!-- Utility 2: Tra cứu & Thanh toán cước -->
        <a href="#plans-section" class="utility-item quick-utility-item" data-aos="fade-up" data-aos-delay="100">
          <div class="utility-icon-box" style="background: rgba(14, 165, 233, 0.1); color: #0EA5E9;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
          </div>
          <div class="utility-text">
            <span class="utility-title">Bảng giá</span>
            <span class="utility-subtitle">Theo địa bàn</span>
          </div>
        </a>

        <!-- Utility 3: Trắc nghiệm tìm gói -->
        <button type="button" class="utility-item quick-utility-item" onclick="openQuizModal()" data-aos="fade-up" data-aos-delay="150">
          <div class="utility-icon-box" style="background: rgba(168, 85, 247, 0.1); color: #A855F7;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <div class="utility-text">
            <span class="utility-title">Chọn gói</span>
            <span class="utility-subtitle">3 câu hỏi nhanh</span>
          </div>
        </button>

        <!-- Utility 4: {{ contact_phone_display }} -->
        <a href="tel:{{ contact_phone }}" class="utility-item quick-utility-item" data-aos="fade-up" data-aos-delay="200">
          <div class="utility-icon-box" style="background: rgba(34, 197, 94, 0.1); color: #22C55E;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="utility-text">
            <span class="utility-title">Gọi tư vấn</span>
            <span class="utility-subtitle">{{ contact_phone_display }}</span>
          </div>
        </a>

        <!-- Utility 5: Điểm giao dịch -->
        <a href="#footer-branch-offices" class="utility-item quick-utility-item" data-aos="fade-up" data-aos-delay="250">
          <div class="utility-icon-box" style="background: rgba(245, 158, 11, 0.1); color: #F59E0B;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div class="utility-text">
            <span class="utility-title">Liên hệ</span>
            <span class="utility-subtitle">Thông tin hỗ trợ</span>
          </div>
        </a>

      </div>
    </div>
  </div>
</section>
