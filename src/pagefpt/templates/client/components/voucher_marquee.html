<!-- Customize Marquee Line cho Mã Giảm Giá nằm ngay dưới Slider -->
<div class="voucher-marquee-container" id="voucher-marquee-container" aria-label="Khuyến mãi & Mã giảm giá FPT">
  <div class="voucher-marquee-bar">
    <div class="voucher-marquee-badge">
      <span class="voucher-marquee-badge-dot" aria-hidden="true"></span>
      <span class="voucher-marquee-badge-icon">🎁</span>
      <span class="voucher-marquee-badge-text">MÃ GIẢM GIÁ</span>
    </div>
    <div class="voucher-marquee-track-outer">
      <div class="voucher-marquee-track" id="voucher-marquee-track">
        <span class="voucher-marquee-item" id="voucher-marquee-text">
          🎟️ <strong class="voucher-marquee-highlight">ƯU ĐÃI THEO ĐỊA BÀN:</strong> Nhập mã nếu có; giá, quà tặng và điều kiện được xác nhận theo địa chỉ lắp đặt.
        </span>
        <span class="voucher-marquee-item" id="voucher-marquee-text-dup" aria-hidden="true">
          🎟️ <strong class="voucher-marquee-highlight">ƯU ĐÃI THEO ĐỊA BÀN:</strong> Nhập mã nếu có; giá, quà tặng và điều kiện được xác nhận theo địa chỉ lắp đặt.
        </span>
      </div>
    </div>
    <div class="voucher-marquee-actions">
      <button type="button" class="voucher-marquee-btn" id="voucher-marquee-btn" aria-expanded="false" aria-controls="client-voucher-banner">
        <span class="voucher-marquee-btn-icon">🎟️</span>
        <span class="voucher-marquee-btn-text" id="voucher-marquee-btn-label">Nhập mã ưu đãi</span>
      </button>
    </div>
  </div>
  <div id="voucher-banner-slot" class="voucher-banner-slot"></div>
</div>
