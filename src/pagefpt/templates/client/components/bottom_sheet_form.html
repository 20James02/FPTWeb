<!-- Bottom Sheet Lead Intake Modal -->
<div class="bottom-sheet-backdrop" id="bottom-sheet-backdrop" aria-hidden="true" inert onclick="handleBackdropClick(event)">
  <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <!-- Drag Handle -->
    <div class="bottom-sheet-drag-handle" id="sheet-drag-handle"></div>

    <!-- Header -->
    <div class="bottom-sheet-header">
      <div class="bottom-sheet-title" id="sheet-title">Đăng Ký Nhận Tư Vấn</div>
      <button type="button" class="btn-close-sheet" onclick="closeBottomSheet()" aria-label="Đóng form">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Body & Form -->
    <div class="bottom-sheet-body">
      <!-- Selected Plan Summary Card -->
      <div class="selected-plan-summary" id="form-selected-plan-box" hidden>
        <div class="plan-info">
          <span class="p-name" id="form-plan-name">Gói đang chọn: Tư vấn gói phù hợp</span>
          <span class="p-fee" id="form-plan-fee">Giá được xác nhận theo khu vực</span>
        </div>
        <button type="button" class="btn-change-plan" onclick="closeBottomSheet(); (document.getElementById('plans-section') || document.getElementById('lp-plans') || document.getElementById('speedtest-recommendations'))?.scrollIntoView({behavior: 'smooth'})">Đổi gói</button>
      </div>

      <form id="lead-intake-form" onsubmit="handleLeadSubmit(event)">
        <!-- Honeypot field against bots -->
        <input type="text" name="hp_confirm" id="lead-hp" class="hp-field" aria-hidden="true" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="lead-name">Tên</label>
          <input type="text" id="lead-name" class="form-input" placeholder="Ví dụ: Nguyễn Văn An" maxlength="150" autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="lead-phone">Số điện thoại <span class="req">*</span></label>
          <input type="tel" id="lead-phone" class="form-input" inputmode="tel" placeholder="Ví dụ: 0981234567" maxlength="40" required autocomplete="tel" aria-describedby="phone-error-msg">
          <div class="form-error-msg" id="phone-error-msg" role="alert">Vui lòng nhập số điện thoại hợp lệ (10 số).</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="lead-address">Địa chỉ cụ thể</label>
          <input type="text" id="lead-address" class="form-input" placeholder="Số nhà, đường, xã/phường, tỉnh/thành" maxlength="500" autocomplete="street-address">
        </div>

        <!-- Consent Checkbox -->
        <div class="consent-box">
          <input type="checkbox" id="lead-consent" checked required>
          <label for="lead-consent">
            Tôi đồng ý được liên hệ tư vấn theo thông tin trên.
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit-lead" class="btn-submit-lead">
          <span id="btn-submit-text">Gửi Yêu Cầu Tư Vấn</span>
          <span id="btn-submit-spinner" class="spinner" style="display: none;"></span>
        </button>

        <p style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">
          <a href="/chinh-sach-bao-mat" target="_blank" rel="noopener noreferrer">Xem thông tin về dữ liệu khách hàng ↗</a>
        </p>
      </form>
    </div>
  </div>
</div>
