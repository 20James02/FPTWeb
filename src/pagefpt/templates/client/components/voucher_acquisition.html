<dialog id="voucher-acquisition" class="voucher-acquisition voucher-ticket-modal" aria-labelledby="voucher-acquisition-title" aria-describedby="voucher-acquisition-label">
  <!-- Canvas pháo hoa bùng nổ hiệu năng cao 60fps -->
  <canvas id="voucher-confetti-canvas" class="voucher-confetti-canvas" aria-hidden="true"></canvas>

  <!-- Giai đoạn 1: Hộp Quà 3D Nổi Lên & Mở Nắp -->
  <div id="voucher-gift-intro" class="voucher-gift-intro" aria-hidden="true">
    <div class="gift-radial-rays"></div>
    <div class="gift-box-3d" id="voucher-gift-box" title="Nhấn vào hộp quà để mở ngay">
      <!-- Nắp hộp quà với nơ vàng kim hoàng gia -->
      <div class="gift-lid-group">
        <div class="gift-bow">
          <span class="bow-loop bow-left"></span>
          <span class="bow-loop bow-right"></span>
          <span class="bow-knot"></span>
          <span class="bow-ribbon ribbon-left"></span>
          <span class="bow-ribbon ribbon-right"></span>
        </div>
        <div class="gift-lid-cap"></div>
      </div>
      <!-- Thân hộp quà đỏ cam FPT đính ruy băng chữ thập vàng -->
      <div class="gift-box-body">
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
      </div>
      <!-- Luồng sáng vàng lóe lên từ miệng hộp -->
      <div class="gift-glow-burst"></div>
    </div>
    <p class="gift-intro-hint" id="voucher-gift-hint">🎁 Chạm vào hộp quà để mở ưu đãi!</p>
  </div>

  <!-- Giai đoạn 2: Tấm Vé Voucher Bay Ra Phóng To Lộng Lẫy -->
  <div class="voucher-acquisition-panel voucher-ticket-card" id="voucher-ticket-panel">
    <!-- Nút đóng tinh tế -->
    <button id="voucher-acquisition-close" class="voucher-acquisition-close" type="button" aria-label="Đóng thông tin ưu đãi">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>

    <!-- Rãnh khoét bán nguyệt tạo hình vé voucher 2 bên hông -->
    <div class="ticket-notch ticket-notch-left" aria-hidden="true"></div>
    <div class="ticket-notch ticket-notch-right" aria-hidden="true"></div>

    <!-- Nội dung Tấm Vé Ưu Đãi Hoàng Gia -->
    <div class="voucher-ticket-inner" id="voucher-ticket-inner">
      <div class="voucher-ticket-head">
        <span class="voucher-acquisition-eyebrow" id="voucher-acquisition-eyebrow">🎁 ƯU ĐÃI ĐẶC QUYỀN</span>
        <h2 id="voucher-acquisition-title">Chúc mừng! Bạn nhận được ưu đãi</h2>
        <p id="voucher-acquisition-label" class="voucher-acquisition-label"></p>
        <div id="voucher-urgency-badge" class="voucher-urgency-badge" hidden></div>
      </div>

      <!-- KHỐI QUÀ TẶNG SẢN PHẨM THẬT (PHYSICAL GIFT SHOWCASE) -->
      <div id="voucher-hero-gift-wrap" class="voucher-hero-gift-wrap" hidden>
        <div class="gift-image-frame">
          <img id="voucher-hero-gift-img" class="voucher-hero-gift-img" src="" alt="Quà tặng hiện vật" loading="lazy">
          <span class="gift-badge-floating">✨ QUÀ CHÍNH HÃNG</span>
        </div>
        <div id="voucher-gift-market-box" class="voucher-gift-market-box">
          <span class="gift-market-label">Trị giá:</span>
          <del id="voucher-gift-market-val" class="gift-market-del">1.200.000đ</del>
          <span class="gift-free-badge">ĐẶC QUYỀN: 0đ</span>
        </div>
      </div>

      <!-- KHỐI SỐ TIỀN / QUÀ ƯU ĐÃI TO NỔI BẬT (HERO DISCOUNT BANNER) -->
      <div class="voucher-hero-discount" id="voucher-hero-discount">
        <div class="hero-discount-header">
          <span class="hero-discount-sparkle">✨</span>
          <span class="hero-discount-prefix" id="voucher-hero-prefix">GIẢM TRỰC TIẾP</span>
          <span class="hero-discount-sparkle">✨</span>
        </div>
        <div class="hero-discount-amount-wrap">
          <strong id="voucher-hero-amount" class="hero-discount-amount">—</strong>
        </div>
        <p class="hero-discount-sub" id="voucher-hero-sub">Áp dụng trực tiếp khi lắp đặt FPT</p>
      </div>

      <!-- Đường nét đứt chia cuống vé dập lỗ -->
      <div class="ticket-perforated-line" aria-hidden="true">
        <span class="ticket-cut-icon">✂</span>
      </div>

      <div class="voucher-ticket-body">
        <!-- Danh sách quyền lợi chi tiết -->
        <div id="voucher-acquisition-benefits" class="voucher-acquisition-benefits"></div>

        <!-- Khối thẻ Coupon Box VIP -->
        <div class="voucher-acquisition-ticket">
          <div class="ticket-code-zone">
            <span class="ticket-field-label">MÃ ƯU ĐÃI</span>
            <div class="ticket-code-row">
              <strong id="voucher-acquisition-code">—</strong>
              <button type="button" id="voucher-copy-btn" class="btn-copy-code" title="Sao chép mã ưu đãi">📋 Sao chép</button>
            </div>
          </div>
          <div class="ticket-date-zone">
            <span class="ticket-field-label">HẠN DÙNG</span>
            <strong id="voucher-acquisition-end">—</strong>
          </div>
        </div>

        <details class="voucher-acquisition-conditions">
          <summary>Điều kiện áp dụng ▾</summary>
          <p id="voucher-acquisition-terms"></p>
        </details>
      </div>

      <!-- Chân vé: Nút hành động quét sáng rực rỡ -->
      <div class="voucher-ticket-foot">
        <button id="voucher-acquisition-use" class="voucher-acquisition-use" type="button">
          <span id="voucher-acquisition-use-text">NHẬN ƯU ĐÃI NGAY</span>
          <span class="use-arrow-icon" aria-hidden="true">➔</span>
        </button>
        <p class="voucher-acquisition-reassurance" id="voucher-acquisition-reassurance">🔒 Tư vấn miễn phí, không cần thanh toán trước.</p>
        <button id="voucher-acquisition-later" class="voucher-acquisition-later" type="button">Bỏ qua ưu đãi</button>
      </div>
    </div>
  </div>
</dialog>
<button id="voucher-acquisition-reminder" class="voucher-acquisition-reminder" type="button" hidden>
  <span class="reminder-gift-icon" aria-hidden="true">🎁</span>
  <span id="voucher-acquisition-reminder-label">Ưu đãi của bạn</span>
</button>
