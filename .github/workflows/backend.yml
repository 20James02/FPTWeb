name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAGEFPT_TEST_DSN: postgresql://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python tools/setup_test_db.py
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy src
      - run: uv run python tools/check_architecture.py
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/contracts/browser_api.mjs
      - run: uv run python tools/export_openapi.py
      - run: uv build
      - run: uv run python tools/verify_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-wheel-and-schema
          path: |
            dist/*.whl
            docs/backend/openapi.json
